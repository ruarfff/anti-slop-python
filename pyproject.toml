[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "anti-slop-python"
dynamic = ["version"]
description = "An opinionated architectural linter for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ruairí O'Brien" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["linter", "pre-commit", "ruff", "code-quality", "architecture", "anti-slop"]
dependencies = [
    "ruff>=0.16.5,<0.17",
]

[project.urls]
Homepage = "https://github.com/ruarfff/anti-slop-python"
Repository = "https://github.com/ruarfff/anti-slop-python"
Issues = "https://github.com/ruarfff/anti-slop-python/issues"

[project.scripts]
anti-slop-python = "anti_slop_python.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/anti_slop_python"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
exclude = ["examples"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
extend-select = ["ANN", "BLE001", "C901", "PLR0915", "TID251"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 40

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"mock.patch".msg = "Avoid patching state. Pass the dependency explicitly instead."
"unittest.mock.patch".msg = "Avoid patching state. Pass the dependency explicitly instead."
